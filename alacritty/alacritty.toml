# Click targets, tried in order; the first one matching under the cursor wins.
# URLs come first, since a URL contains path-shaped text, and paths come before
# task identifiers, since `dan_openable` lets a path rule decline a match wormhole
# would not open and fall through. The table names are Alacritty's schema.

# `wormhole` is not on the PATH that launchd gives GUI apps, so these run via
# `sh -c`, which is cheap and avoids hardcoding a home directory. --no-create
# because the matched text is whatever happened to be on screen.

# Which matches to offer is wormhole's to answer, not a regex's: what a relative
# path names depends on the tmux pane that printed it, which Alacritty cannot see.
[hints]
dan_openable_command = { program = "/bin/sh", args = ['-c', 'exec "$HOME/bin/wormhole" openable "$@"', 'sh'] }

# URLs, and any OSC 8 link.
[[hints.enabled]]
command = "open"
hyperlinks = true
regex = "(https:|http:|file:|file-line-column:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "Period"
mods = "Command"

[hints.enabled.mouse]
enabled = true
mods = "Command"

# Python traceback frames, which carry the line number outside the path.
[[hints.enabled]]
dan_openable = true
command = { program = "/bin/sh", args = ['-c', 'exec "$HOME/bin/wormhole" open --no-create "$0"'] }
regex = 'File "[^"]+", line [0-9]+'

[hints.enabled.mouse]
enabled = true
mods = "Command"

# Paths: absolute, ./ ../ ~/, relative, or a bare filename, optionally followed
# by :line, :line:column, :line-line, or (line) as pdb prints it. The regex only
# says what shape to consider; whether it names a file is wormhole's answer.
[[hints.enabled]]
dan_openable = true
command = { program = "/bin/sh", args = ['-c', 'exec "$HOME/bin/wormhole" open --no-create "$0"'] }
regex = '((~|\.{1,2})?/[A-Za-z0-9._~/+-]+|[A-Za-z0-9._~+-]+/[A-Za-z0-9._~/+-]+|[A-Za-z0-9_+-]+\.[A-Za-z0-9]+)(\([0-9]+\)|:[0-9]+-[0-9]+|(:[0-9]+){0,2})'

[hints.enabled.binding]
key = "Period"
mods = "Command|Shift"

[hints.enabled.mouse]
enabled = true
mods = "Command"

# Wormhole task identifiers (repo:branch, or :branch). Only those naming a task
# that exists are offered, which is also what keeps a filename with a line number
# from reading as one.
[[hints.enabled]]
dan_openable = true
command = { program = "/bin/sh", args = ['-c', 'exec "$HOME/bin/wormhole" open --no-create "$0"'] }
regex = '([A-Za-z0-9][A-Za-z0-9._-]*)?:[A-Za-z0-9._/-]*[A-Za-z_/-][A-Za-z0-9._/-]*'

[hints.enabled.mouse]
enabled = true
mods = "Command"

# Launch tmux via a login shell so it resolves from PATH (GUI apps get launchd's
# minimal PATH, which lacks Homebrew); avoids hardcoding tmux's absolute path.
[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "exec tmux new-session -A -s 0"]

[window]
startup_mode = "SimpleFullscreen"
option_as_alt = "OnlyLeft"   # or "Both"

[window.padding]
x = 7
y = 7

