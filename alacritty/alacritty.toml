# micro editor: Cmd-<key> -> raw escape sequences bound in micro/bindings.json.
#
# micro can only register a raw sequence that starts with ESC
# (screen.RegisterRawSeq), and every layer in between reads the byte after the
# ESC as a Meta key it may have bound -- so the prefix has to be one that
# neither zsh nor tmux binds, and both have bitten:
#
#   ESC "cmd"  zsh binds ESC-c to capitalize-word and ESC-a to accept-and-hold,
#              which ate two bytes and typed the rest ("mdc", "mda", ...).
#   ESC ";"    tmux.conf binds M-\; to `tide home`, so tmux ran tide and passed
#              on only the tail: Cmd-S typed "s" rather than saving.
#
# ESC-~ is bound by neither. These reach the bare shell prompt routinely,
# because tmux's `mouse on` means a mouse drag makes a tmux selection rather
# than an Alacritty one, so shell/zsh/bindings.zsh binds ESC-~ to discard the
# single byte that follows: keep every sequence one byte after the prefix to
# hold that widget correct. test-cmd-key-passthrough checks all of this.
# Cmd-D was dropped: nothing ever bound it.

# Cmd-C: copy Alacritty's own selection when there is one, else fall through to
# the application. Ctrl-] rather than an ESC sequence because tmux binds it in
# copy-mode and tmux can only bind a single key; it is undefined-key in zsh too.
[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Command"
mode = "dan_selection"

[[keyboard.bindings]]
chars = "\u001d"
key = "C"
mods = "Command"
mode = "~dan_selection"

[[keyboard.bindings]]
chars = "\u001b~a"
key = "A"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~f"
key = "F"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~g"
key = "G"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~G"
key = "G"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u001b~s"
key = "S"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~x"
key = "X"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~z"
key = "Z"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~Z"
key = "Z"
mods = "Command|Shift"

# Cmd-O -> Ctrl-O: open in the wormhole editor. In rgi/fzf opens the search
# result (vs Enter, which opens micro in-terminal); in micro opens the
# current line (Ctrl-o in micro/bindings.json).
[[keyboard.bindings]]
chars = "\u000f"
key = "O"
mods = "Command"


