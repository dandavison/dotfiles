# micro editor: Cmd-<key> -> raw escape sequences bound in micro/bindings.json.
#
# micro can only register a raw sequence that starts with ESC
# (screen.RegisterRawSeq), and every layer in between reads the byte after the
# ESC as a Meta key it may have bound -- so the prefix has to be one that
# neither zsh nor tmux binds, and both have bitten:
#
#   ESC "cmd"  zsh binds ESC-c to capitalize-word and ESC-a to accept-and-hold,
#              which ate two bytes and typed the rest ("mdc", "mda", ...).
#   ESC ";"    tmux.conf binds M-\; to `tide home`, so tmux ran tide and passed
#              on only the tail: Cmd-S typed "s" rather than saving.
#
# ESC-~ is bound by neither. These reach the bare shell prompt routinely,
# because tmux's `mouse on` means a mouse drag makes a tmux selection rather
# than an Alacritty one, so shell/zsh/bindings.zsh binds ESC-~ to discard the
# single byte that follows: keep every sequence one byte after the prefix to
# hold that widget correct. test-cmd-key-passthrough checks all of this.
# Cmd-D was dropped: nothing ever bound it.

# Cmd-C: copy Alacritty's own selection when there is one, else fall through to
# the application. Ctrl-] rather than an ESC sequence because tmux binds it in
# copy-mode and tmux can only bind a single key; it is undefined-key in zsh too.
[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Command"
mode = "Selection"

[[keyboard.bindings]]
chars = "\u001d"
key = "C"
mods = "Command"
mode = "~Selection"

[[keyboard.bindings]]
chars = "\u001b~a"
key = "A"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~f"
key = "F"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~s"
key = "S"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~x"
key = "X"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~z"
key = "Z"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b~Z"
key = "Z"
mods = "Command|Shift"

# Cmd-O -> Ctrl-O: open in the wormhole editor. In rgi/fzf opens the search
# result (vs Enter, which opens micro in-terminal); in micro opens the
# current line (Ctrl-o in micro/bindings.json).
[[keyboard.bindings]]
chars = "\u000f"
key = "O"
mods = "Command"


[terminal]

[colors.bright]
black = "0x4c4c4c"
blue = "0x6871ff"
cyan = "0x1e81b0"
green = "0x5ff967"
magenta = "0xff76ff"
red = "0xff6d67"
white = "0x6b6868"
yellow = "0xfe9a67"

[colors.normal]
black = "0x000000"
blue = "0x0225c7"
cyan = "0x0073c7"
green = "0x066c06"
magenta = "0xc930c7"
red = "0xc91b00"
white = "0xc7c7c7"
yellow = "0xe55611"

[colors.primary]
background = "0xfffefe"
foreground = "0x000000"

[colors.cursor]
cursor = "0x0550ae"
text = "CellBackground"

[cursor]
thickness = 0.4

[cursor.style]
shape = "Beam"

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "Monaco"
style = "Regular"

# Hints are tried in order and the first one matching under the cursor wins, so
# the URL hint must precede the path hint: a URL contains path-shaped text.

# URLs, and any OSC 8 hyperlink.
[[hints.enabled]]
command = "open"
hyperlinks = true
regex = "(https:|http:|file:|file-line-column:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "Period"
mods = "Command"

[hints.enabled.mouse]
enabled = true
mods = "Command"

# Python traceback frames, which carry the line number outside the path.
[[hints.enabled]]
# `wormhole` is not on the PATH that launchd gives GUI apps; `sh -c` is cheap
# and avoids hardcoding a home directory.
command = { program = "/bin/sh", args = ['-c', 'exec "$HOME/bin/wormhole" hint "$0"'] }
regex = 'File "[^"]+", line [0-9]+'

[hints.enabled.mouse]
enabled = true
mods = "Command"

# Paths (absolute, ./ ../ ~/, relative, or a bare filename), optionally followed
# by :line, :line:column, or (line) as pdb prints it; and wormhole task
# identifiers (repo:branch). `wormhole hint` decides which it is, resolving
# relative paths against the cwd Alacritty gives the spawned command.
[[hints.enabled]]
# `wormhole` is not on the PATH that launchd gives GUI apps; `sh -c` is cheap
# and avoids hardcoding a home directory.
command = { program = "/bin/sh", args = ['-c', 'exec "$HOME/bin/wormhole" hint "$0"'] }
regex = '((~|\.{1,2})?/[A-Za-z0-9._~/+-]+|[A-Za-z0-9._~+-]+/[A-Za-z0-9._~/+-]+|[A-Za-z0-9_+-]+\.[A-Za-z0-9]+|[A-Za-z0-9][A-Za-z0-9._-]*:[A-Za-z0-9._/-]*[A-Za-z_/-][A-Za-z0-9._/-]*)(\([0-9]+\)|(:[0-9]+){0,2})'

[hints.enabled.binding]
key = "Period"
mods = "Command|Shift"

[hints.enabled.mouse]
enabled = true
mods = "Command"

# Double-click selection in tmux popups is Alacritty's, not tmux's (see
# dotfiles/tmux/tmux.conf), so keep the word boundaries identical: tmux's
# word-separators plus space and tab, which tmux always breaks on (WHITESPACE in
# grid_reader_cursor_previous_word) whether or not they are in the option.
[selection]
semantic_escape_chars = "\t !\"#$%&'()*+,:;<=>?@[\\]^`{|}~"

# Launch tmux via a login shell so it resolves from PATH (GUI apps get launchd's
# minimal PATH, which lacks Homebrew); avoids hardcoding tmux's absolute path.
[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "exec tmux new-session -A -s 0"]

[window]
startup_mode = "SimpleFullscreen"
option_as_alt = "OnlyLeft"   # or "Both"

[window.padding]
x = 7
y = 7

