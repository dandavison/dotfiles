# The active editor: source of truth for wormhole and for editor-aware shell
# functions/tools (queried live via `wormhole editor`). Switch with either
# `wormhole editor <name>` (writes back here) or by editing this line and
# running `wormhole refresh`. One of: cursor, code, code-insiders, emacs, idea,
# pycharm, pycharm-ce, none.
default_project = "temporal"
editor = "micro"

search_paths = [
    "~/src/temporalio",
    "~/src/temporalio-etc",
    "~/src",
    "~/src/devenv",
]

projects = [
	"~/tmp/3p/ai",
	"/Users/dan/tmp/3p/ai/restate",
]

card_commands = [
    "ls .task",
    "git log --format='%an|%ar|%s' -n 3 | awk -F'|' '{split($1,a,\" \"); gsub(/ ago$/,\"\",$2); printf \"%-10s %-15s %s\\n\", a[1], $2, $3}'",
]

[available]
exclude = [
    "devenv",
]


[project_branches]
"*" = ["{project}-*", "z-{project}-*"]
"temporal:dan/saa-model-tests-w-transitions-conformance-explorer" = ["wfa-saa-*"]

# Agents started in any worktree of a Temporal repo find the Temporal AGENTS.md in a parent
# directory; .agents-root makes codex read AGENTS.md files from there down.

["worktree_links"."~/src/temporalio"]
"AGENTS.md" = "~/src/devenv/temporal/dotfiles/AGENTS.md"
"CLAUDE.md" = "~/src/devenv/temporal/dotfiles/AGENTS.md"
".agents-root" = "~/src/devenv/temporal/dotfiles/AGENTS.md"

["worktree_links"."~/src/temporalio-etc"]
"AGENTS.md" = "~/src/devenv/temporal/dotfiles/AGENTS.md"
"CLAUDE.md" = "~/src/devenv/temporal/dotfiles/AGENTS.md"
".agents-root" = "~/src/devenv/temporal/dotfiles/AGENTS.md"
