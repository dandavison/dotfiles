# Models offered by agent-pick (agent-oneshot, agent-from-issues).
# cli: claude | codex | pi. A model with `health` is offered only if that URL responds.
# price: USD per million tokens, used by agent-oneshot for codex (claude reports its own cost).
# Long-context tiers are not modeled.

[accounts.personal]
CLAUDE_CONFIG_DIR = "~/.claude-personal"
CODEX_HOME = "~/.codex-personal"

[[models]]
name = "opus"
cli = "claude"
model = "claude-opus-5-5"

[[models]]
name = "sonnet"
cli = "claude"
model = "claude-sonnet-5-5"

[[models]]
name = "haiku"
cli = "claude"
model = "claude-haiku-4-5-20251001"

[[models]]
name = "luna"
cli = "codex"
model = "gpt-6-luna"
# https://openrouter.ai/openai/gpt-6-luna
price = { input = 0.10, cached_input = 0.01, cache_write = 0.125, output = 0.50 }

[[models]]
name = "qwen-local"
cli = "pi"
model = "mlx/mlx-community/Qwen3.6-35B-A3B-4bit"
health = "http://localhost:8080/v1/models"
